<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>decki.ai</title>
    <script>
      // Keep GitHub Pages project-site routes under the repository base path.
      // index.html restores this route before React Router starts.
      var l = window.location;
      var base = '/decki.ai';
      var route = l.pathname.startsWith(base + '/')
        ? l.pathname.slice(base.length)
        : '/';
      l.replace(
        l.protocol + '//' + l.host + base + '/?p=' +
        encodeURIComponent(route + l.search)
      );
    </script>
  </head>
  <body></body>
</html>
