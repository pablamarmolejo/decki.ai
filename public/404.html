<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>decki.ai</title>
    <script>
      // Single-Page App GitHub Pages redirect trick.
      // Encodes the full path as a query param and redirects to index.html,
      // which restores the route before the app starts.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname.replace(/^\/[^/]+/, '') + l.search + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
